<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Quản trị | Vietnam Travel</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .auth-container {
      max-width: 450px;
      margin: 80px auto;
      padding: 30px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      text-align: center;
      border-top: 5px solid #d32f2f;
    }
    .auth-container h2 {
      margin-bottom: 20px;
      color: #d32f2f;
    }
    .auth-container .admin-btn {
      background: #d32f2f;
    }
    .auth-container .admin-btn:hover {
      background: #b71c1c;
      box-shadow: 0 12px 20px rgba(211, 47, 47, 0.3);
    }
    .back-link {
      display: block;
      margin-top: 20px;
      color: var(--text-muted);
      text-decoration: underline;
    }
  </style>
</head>

<body class="home-page">
  <nav>
    <div class="nav-logo">Admin - Vietnam Travel</div>
    <div class="nav-links">
      <a href="index.html">Quay lại trang chủ</a>
    </div>
  </nav>

  <main>
    <div class="auth-container">
      <h2>Hệ thống Quản trị Web</h2>
      <form id="admin-login-form" class="contact-form">
        <div class="form-group">
          <input type="text" id="admin-username" placeholder="Tên đăng nhập dành cho Quản trị viên" required>
        </div>
        <div class="form-group">
          <input type="password" id="admin-password" placeholder="Mật khẩu Quản trị viên" required>
        </div>
        <button type="submit" class="btn-submit admin-btn">Truy cập Trang Quản Trị <i class="fas fa-lock"></i></button>
      </form>
      <a href="login.html" class="back-link">Về trang đăng nhập người dùng</a>
    </div>
  </main>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('admin-username').value;
      if (username) {
        localStorage.setItem('adminUser', JSON.stringify({ admin: username }));
        alert('Đăng nhập Quản trị thành công!');
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
